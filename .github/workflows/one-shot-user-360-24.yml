name: One-shot User 360 product patch

on:
  push:
    branches: [feat/user-360-24]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/user-360-24
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply bounded User 360 product patch
        run: |
          python - <<'PY'
          from pathlib import Path

          edge = Path('supabase/functions/membership-admin/index.ts')
          text = edge.read_text()
          marker = '  try {\n    if (MUTATING_ACTIONS.has(action)) await requireAal2();'
          helper = '''  const loadUserSummaries = async () => {\n    const { data: authUsers, error: authUsersError } = await admin.auth.admin.listUsers({ page: 1, perPage: 50 });\n    if (authUsersError) throw authUsersError;\n    const users = authUsers.users ?? [];\n    const ids = users.map((user) => user.id);\n    if (!ids.length) return { total: authUsers.total ?? 0, users: [] };\n\n    const [profilesResult, accountsResult, entitlementsResult, subscriptionsResult] = await Promise.all([\n      admin.from("profiles").select("id,display_name,updated_at").in("id", ids),\n      admin.from("product_accounts").select("user_id,product_code,last_seen_at").in("user_id", ids),\n      admin.from("entitlements").select("user_id,entitlement_code,active,valid_until").in("user_id", ids),\n      admin.from("subscriptions").select("user_id,product_code,status,current_period_end").in("user_id", ids),\n    ]);\n    for (const result of [profilesResult, accountsResult, entitlementsResult, subscriptionsResult]) {\n      if (result.error) throw result.error;\n    }\n\n    const profiles = new Map((profilesResult.data ?? []).map((row) => [row.id, row]));\n    const accounts = accountsResult.data ?? [];\n    const entitlements = entitlementsResult.data ?? [];\n    const subscriptions = subscriptionsResult.data ?? [];\n    const now = Date.now();\n    const activeSubscriptionStatuses = new Set(["active", "trialing", "past_due"]);\n\n    const summaries = users.map((user) => {\n      const userAccounts = accounts.filter((row) => row.user_id === user.id);\n      const userEntitlements = entitlements.filter((row) => {\n        if (row.user_id !== user.id || !row.active) return false;\n        const validUntil = row.valid_until ? new Date(row.valid_until).getTime() : null;\n        return !validUntil || validUntil > now;\n      });\n      const userSubscriptions = subscriptions.filter((row) => row.user_id === user.id && activeSubscriptionStatuses.has(String(row.status)));\n      const lastActivity = userAccounts\n        .map((row) => row.last_seen_at)\n        .filter(Boolean)\n        .sort()\n        .at(-1) ?? null;\n      return {\n        id: user.id,\n        email: user.email ?? null,\n        display_name: profiles.get(user.id)?.display_name ?? null,\n        created_at: user.created_at,\n        last_sign_in_at: user.last_sign_in_at,\n        last_activity_at: lastActivity,\n        products: [...new Set(userAccounts.map((row) => row.product_code).filter(Boolean))].sort(),\n        active_entitlements: userEntitlements.length,\n        active_subscriptions: userSubscriptions.length,\n      };\n    });\n    summaries.sort((a, b) => String(b.last_activity_at ?? b.last_sign_in_at ?? b.created_at ?? "").localeCompare(String(a.last_activity_at ?? a.last_sign_in_at ?? a.created_at ?? "")));\n    return { total: authUsers.total ?? users.length, users: summaries };\n  };\n\n'''
          if marker not in text:
              raise SystemExit('membership-admin try marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = '''      const [{ data: products }, { data: mappings }, userCount, subscriptionCount, grantCount, actionCount, { data: recentActions }] = await Promise.all([\n        admin.from("billing_products").select("product_code,name,app_url,active").eq("active", true).order("name"),\n        admin.from("billing_product_entitlements").select("product_code,entitlement_code").order("product_code"),\n        admin.auth.admin.listUsers({ page: 1, perPage: 1 }),'''
          new = '''      const [{ data: products }, { data: mappings }, userOverview, subscriptionCount, grantCount, actionCount, { data: recentActions }] = await Promise.all([\n        admin.from("billing_products").select("product_code,name,app_url,active").eq("active", true).order("name"),\n        admin.from("billing_product_entitlements").select("product_code,entitlement_code").order("product_code"),\n        loadUserSummaries(),'''
          if old not in text:
              raise SystemExit('bootstrap user-count block not found')
          text = text.replace(old, new, 1)
          text = text.replace('          users: userCount.data?.total ?? 0,', '          users: userOverview.total,', 1)
          marker = '        recent_actions: recentActions ?? [],\n      });'
          if marker not in text:
              raise SystemExit('bootstrap response marker not found')
          text = text.replace(marker, '        recent_actions: recentActions ?? [],\n        users: userOverview.users,\n      });', 1)
          edge.write_text(text)

          html = Path('index.html')
          text = html.read_text()
          old = '''      <section class="search-panel">\n        <div>\n          <p class="eyebrow">MEMBER LOOKUP</p>\n          <h2>查找会员</h2>\n          <p>用户需要至少完成过一次 Supabase 登录。</p>\n        </div>\n        <form id="member-search" class="search-form">\n          <label>\n            <span>邮箱地址</span>\n            <input id="search-email" type="email" autocomplete="off" placeholder="user@example.com" required>\n          </label>\n          <button class="button primary" type="submit">打开会员档案</button>\n        </form>\n      </section>'''
          new = '''      <section class="search-panel user-360-panel" aria-labelledby="user-360-title">\n        <div class="user-360-heading">\n          <div>\n            <p class="eyebrow">USER 360</p>\n            <h2 id="user-360-title">用户</h2>\n            <p>先从最近活跃用户进入；已知邮箱仍可精确检索。详情继续使用同一会员档案。</p>\n          </div>\n          <form id="member-search" class="search-form">\n            <label>\n              <span>邮箱地址</span>\n              <input id="search-email" type="email" autocomplete="off" placeholder="user@example.com" required>\n            </label>\n            <button class="button primary" type="submit">打开用户档案</button>\n          </form>\n        </div>\n        <div class="user-360-list-wrap">\n          <div class="user-360-list-head"><strong>最近用户</strong><span id="user-360-note">最近 50 个账户</span></div>\n          <div id="user-360-list" class="user-360-list"><p class="empty-copy">正在载入用户…</p></div>\n        </div>\n      </section>'''
          if old not in text:
              raise SystemExit('member search panel not found')
          html.write_text(text.replace(old, new, 1))

          script = Path('admin.js')
          text = script.read_text()
          old = "  searchForm: $('#member-search'), searchEmail: $('#search-email'),\n  emptyWorkspace: $('#empty-workspace'), memberWorkspace: $('#member-workspace'),"
          new = "  searchForm: $('#member-search'), searchEmail: $('#search-email'),\n  userList: $('#user-360-list'), userNote: $('#user-360-note'),\n  emptyWorkspace: $('#empty-workspace'), memberWorkspace: $('#member-workspace'),"
          if old not in text:
              raise SystemExit('admin elements marker not found')
          text = text.replace(old, new, 1)
          marker = 'function renderBootstrap() {'
          helper = '''function renderUserSummaries(users) {\n  if (!els.userList) return;\n  const rows = Array.isArray(users) ? users : [];\n  if (els.userNote) els.userNote.textContent = rows.length ? `最近 ${rows.length} 个账户` : '暂无账户';\n  els.userList.innerHTML = rows.length ? rows.map((user) => {\n    const products = (user.products || []).length ? user.products.join(' · ') : '尚无产品活动';\n    const activity = user.last_activity_at || user.last_sign_in_at || user.created_at;\n    return `\n      <button class="user-summary" type="button" data-user-id="${escapeHtml(user.id)}">\n        <span class="user-summary-identity"><strong>${escapeHtml(user.display_name || user.email || user.id)}</strong><small>${escapeHtml(user.email || user.id)}</small></span>\n        <span class="user-summary-products">${escapeHtml(products)}</span>\n        <span class="user-summary-metrics"><b>${escapeHtml(String(user.active_entitlements || 0))}</b> 权益 · <b>${escapeHtml(String(user.active_subscriptions || 0))}</b> 订阅</span>\n        <span class="user-summary-time">${escapeHtml(formatDate(activity))}</span>\n      </button>`;\n  }).join('') : '<p class="empty-copy">还没有可显示的 Supabase 用户。</p>';\n}\n\n'''
          if marker not in text:
              raise SystemExit('renderBootstrap marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = '  els.statActions.textContent = data.counts.admin_actions;\n  els.giftProduct.innerHTML = ['
          new = '  els.statActions.textContent = data.counts.admin_actions;\n  renderUserSummaries(data.users || []);\n  els.giftProduct.innerHTML = ['
          if old not in text:
              raise SystemExit('renderBootstrap stats marker not found')
          text = text.replace(old, new, 1)
          marker = "els.searchForm.addEventListener('submit', async (event) => {"
          helper = '''async function openMember(criteria) {\n  state.member = await callAdmin('search_user', criteria);\n  renderMember();\n  setStatus(els.consoleStatus, `已打开 ${state.member.user.email || state.member.user.id}。`, 'success');\n}\n\n'''
          if marker not in text:
              raise SystemExit('search listener marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = "    state.member = await callAdmin('search_user', { email: els.searchEmail.value.trim() });\n    renderMember();\n    setStatus(els.consoleStatus, `已打开 ${state.member.user.email}。`, 'success');"
          if old not in text:
              raise SystemExit('search user body not found')
          text = text.replace(old, "    await openMember({ email: els.searchEmail.value.trim() });", 1)
          marker = "els.giftForm.addEventListener('submit', async (event) => {"
          listener = '''els.userList?.addEventListener('click', async (event) => {\n  const button = event.target.closest('button[data-user-id]');\n  if (!button) return;\n  setBusy(true, '正在打开用户档案…');\n  try {\n    await openMember({ user_id: button.dataset.userId });\n  } catch (error) {\n    setStatus(els.consoleStatus, error.message, 'error');\n  } finally {\n    setBusy(false);\n  }\n});\n\n'''
          if marker not in text:
              raise SystemExit('gift listener marker not found')
          script.write_text(text.replace(marker, listener + marker, 1))

          css = Path('admin.css')
          text = css.read_text()
          if '/* User 360 */' in text:
              raise SystemExit('User 360 styles already exist')
          css.write_text(text + '''\n\n/* User 360 */\n.user-360-panel { display: grid; gap: 22px; }\n.user-360-heading { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 440px); gap: 24px; align-items: end; }\n.user-360-list-wrap { min-width: 0; }\n.user-360-list-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: .82rem; }\n.user-360-list { display: grid; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: rgba(255,255,255,.02); }\n.user-summary { appearance: none; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; display: grid; grid-template-columns: minmax(180px, 1.35fr) minmax(150px, 1fr) minmax(130px, .8fr) minmax(120px, .65fr); gap: 16px; align-items: center; width: 100%; padding: 14px 16px; text-align: left; cursor: pointer; }\n.user-summary:last-child { border-bottom: 0; }\n.user-summary:hover, .user-summary:focus-visible { background: rgba(255,255,255,.055); outline: none; }\n.user-summary-identity { min-width: 0; display: grid; gap: 3px; }\n.user-summary-identity strong, .user-summary-identity small, .user-summary-products { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.user-summary-identity small, .user-summary-products, .user-summary-time { color: var(--muted); }\n.user-summary-metrics { white-space: nowrap; font-size: .86rem; }\n.user-summary-time { white-space: nowrap; font-size: .8rem; text-align: right; }\n@media (max-width: 800px) {\n  .user-360-heading { grid-template-columns: 1fr; align-items: stretch; }\n  .user-summary { grid-template-columns: minmax(0, 1fr) auto; gap: 7px 12px; }\n  .user-summary-products { grid-column: 1 / -1; }\n  .user-summary-metrics { grid-column: 1; }\n  .user-summary-time { grid-column: 2; grid-row: 1; }\n}\n''')

          contract = Path('tests/membership-admin-contract.test.js')
          text = contract.read_text()
          marker = "expect(html.includes('id=\"business-overview\"'), 'Traffic and revenue overview must be present');"
          addition = '''expect(html.includes('id="user-360-list"'), 'User 360 recent-user list must be present');\nexpect(html.includes('id="member-search"'), 'User 360 must retain exact email search');\nexpect(script.includes('function renderUserSummaries(users)'), 'User 360 summaries must have one renderer');\nexpect(script.includes("await openMember({ user_id: button.dataset.userId })"), 'User 360 rows must reuse the existing member detail loader');\nexpect(edge.includes('const loadUserSummaries = async () =>'), 'Membership backend must own User 360 summary assembly');\nexpect(edge.includes('listUsers({ page: 1, perPage: 50 })'), 'User 360 must keep the initial Auth listing bounded');\nexpect(edge.includes('.from("product_accounts").select("user_id,product_code,last_seen_at")'), 'User 360 must use canonical product activity');\nexpect(edge.includes('.from("entitlements").select("user_id,entitlement_code,active,valid_until")'), 'User 360 must summarize canonical entitlements');\nexpect(edge.includes('.from("subscriptions").select("user_id,product_code,status,current_period_end")'), 'User 360 must summarize canonical subscriptions');\nexpect(edge.includes('users: userOverview.users'), 'Bootstrap must expose the bounded User 360 summary list');\n'''
          if marker not in text:
              raise SystemExit('membership contract marker not found')
          contract.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Validate contracts
        run: |
          npm install --no-audit --no-fund
          npm run test:contract
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html admin.js admin.css supabase/functions/membership-admin/index.ts tests/membership-admin-contract.test.js
          git commit -m "feat(admin): add User 360 recent-user flow"
          git push origin HEAD:feat/user-360-24
