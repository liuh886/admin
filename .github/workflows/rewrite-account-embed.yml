name: Rewrite account embed

on:
  push:
    branches: [agent/embedded-account-ci]
    paths:
      - 'scripts/rewrite-account-embed.mjs'
      - '.github/workflows/rewrite-account-embed.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/embedded-account-ci
      - run: node scripts/rewrite-account-embed.mjs
      - name: Commit generated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/account-shell.js shared/account-shell.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: require embedded account mounts"
          git push origin HEAD:agent/embedded-account-ci
