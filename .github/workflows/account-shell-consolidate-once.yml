name: Account shell consolidate once

on:
  push:
    branches:
      - refactor/account-shell-canonical
    paths:
      - .github/workflows/account-shell-consolidate-once.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/account-shell-canonical
          fetch-depth: 0
      - name: Consolidate shared account runtime
        run: python3 scripts/account-shell-consolidate-once.py
      - name: Validate transformed source
        run: |
          node --check shared/account-shell.js
          npm install --no-audit --no-fund
          npm run test:contract
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make account shell the single shared UI owner"
          git push origin HEAD:refactor/account-shell-canonical
