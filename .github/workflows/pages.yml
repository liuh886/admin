name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify browser impact
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt
          if grep -Eq '^(index\.html|admin\.(js|css)|operations\.(js|css)|feedback-admin\.(js|css)|(invite|promotion)\.(js|css)|tests/e2e/|playwright\.config\.js|\.github/workflows/pages\.yml)' changed-files.txt; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run contract tests
        run: npm run test:contract

      - name: Install Chromium
        if: steps.scope.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance
        if: steps.scope.outputs.browser == 'true'
        run: npm run test:e2e

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
