name: Product Health branch patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-health-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/product-health-24
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply Product Health slice
        run: python3 scripts/one-shot-product-health.py
      - name: Verify contracts and syntax
        run: |
          npm install --no-audit --no-fund
          npm run test:contract
          node --check operations.js
      - name: Commit final branch state
        run: |
          rm -f .github/workflows/product-health-one-shot.yml scripts/one-shot-product-health.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(admin): add Product Health operations slice"
          git push origin HEAD:feat/product-health-24
