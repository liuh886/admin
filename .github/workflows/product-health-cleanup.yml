name: Product Health cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-health-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/product-health-24
      - name: Remove generated test artifacts
        run: |
          rm -rf node_modules package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A node_modules package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): remove generated test artifacts"
          git push origin HEAD:feat/product-health-24
