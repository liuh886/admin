name: One-shot account governance closeout

on:
  push:
    branches: [fix/account-governance-closeout-19]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/account-governance-closeout-19
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply bounded governance patch
        run: |
          python - <<'PY'
          from pathlib import Path

          operations = Path('supabase/functions/operations-overview/index.ts')
          text = operations.read_text()
          old = 'import { createClient } from "npm:@supabase/supabase-js@2";'
          new = 'import { createClient } from "npm:@supabase/supabase-js@2.111.0";'
          if old not in text:
              raise SystemExit('operations-overview floating Supabase import not found')
          operations.write_text(text.replace(old, new, 1))

          shell = Path('shared/account-shell.js')
          text = shell.read_text()
          old = '''  function snapshot() {\n    return Object.freeze({\n      configured: true,\n      loading: state.loading,\n      user: state.user,\n      profile: state.profile,\n      productAccount: state.productAccount,\n      entitlements: [...state.entitlements],\n      isPro: state.entitlements.has(config.entitlementCode),\n      subscription: state.subscription,\n      hasPaidSubscription: hasPaidSubscription(),\n      error: state.error,\n      productCode: config.productCode,\n    });\n  }'''
          new = '''  function publicUser() {\n    if (!state.user) return null;\n    const alphaRole = state.user.app_metadata?.alpha_engine_role;\n    return Object.freeze({\n      id: state.user.id,\n      email: state.user.email || null,\n      app_metadata: alphaRole\n        ? Object.freeze({ alpha_engine_role: alphaRole })\n        : Object.freeze({}),\n    });\n  }\n\n  function snapshot() {\n    return Object.freeze({\n      configured: true,\n      loading: state.loading,\n      user: publicUser(),\n      entitlements: [...state.entitlements],\n      isPro: state.entitlements.has(config.entitlementCode),\n      subscription: state.subscription,\n      hasPaidSubscription: hasPaidSubscription(),\n      error: state.error,\n      productCode: config.productCode,\n    });\n  }'''
          if old not in text:
              raise SystemExit('shared account snapshot block not found')
          shell.write_text(text.replace(old, new, 1))

          contract = Path('tests/account-shell-contract.test.js')
          text = contract.read_text()
          old = "const browser = `${script}\\n${css}`;"
          new = "const operationsOverview = fs.readFileSync('supabase/functions/operations-overview/index.ts', 'utf8');\nconst browser = `${script}\\n${css}`;"
          if old not in text:
              raise SystemExit('account contract header marker not found')
          text = text.replace(old, new, 1)
          marker = "expect(script.includes('function subscriptionSummary(t)'), 'Account shell must render subscription lifecycle state');"
          addition = marker + "\n\nexpect(script.includes('function publicUser()'), 'Public account state must be built explicitly');\nexpect(script.includes('user: publicUser()'), 'Account events must expose the bounded public user view');\nexpect(script.includes('alpha_engine_role: alphaRole'), 'The only app metadata exposed publicly is the current Alpha owner role needed by its consumer');\nexpect(!script.includes('profile: state.profile'), 'Account events must not broadcast the full profile row');\nexpect(!script.includes('productAccount: state.productAccount'), 'Account events must not broadcast the full product account row');\nexpect(!script.includes('user: state.user'), 'Account events must not broadcast the full Supabase user object');\nexpect(operationsOverview.includes('npm:@supabase/supabase-js@2.111.0'), 'Operations overview Edge Function must pin Supabase JS exactly');\nexpect(!operationsOverview.includes('npm:@supabase/supabase-js@2\\\"'), 'Operations overview must not return to a floating Supabase JS major import');"
          if marker not in text:
              raise SystemExit('account contract insertion marker not found')
          contract.write_text(text.replace(marker, addition, 1))
          PY
      - name: Validate contracts
        run: |
          npm install --no-audit --no-fund
          npm run test:contract
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/account-shell.js supabase/functions/operations-overview/index.ts tests/account-shell-contract.test.js
          git commit -m "fix(account): bound public state and pin operations SDK"
          git push origin HEAD:fix/account-governance-closeout-19
