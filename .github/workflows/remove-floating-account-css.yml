name: Remove floating account CSS

on:
  push:
    branches: [agent/embedded-account-ci]
    paths:
      - 'scripts/remove-floating-account-css.mjs'
      - '.github/workflows/remove-floating-account-css.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/embedded-account-ci
      - run: node scripts/remove-floating-account-css.mjs
      - name: Commit cleaned shared stylesheet
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shared/account-shell.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove the final floating account style"
          git push origin HEAD:agent/embedded-account-ci
